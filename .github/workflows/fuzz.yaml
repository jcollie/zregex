# Weekly long fuzz session. The per-push ci runs keep a fixed seed so a
# failure is reproducible and every push measures the same thing; this one
# walks the seed with the run number instead, because the point of a long
# session is to reach the patterns a single stream never produces. The seed
# that ran is in the job log's command line, so a failure is still
# reproducible with `zig build test -Dfuzz-cases=... -Dfuzz-seed=<n>`.
#
# Two runners: x86_64 Linux, and macOS on Apple silicon — the one place the
# aarch64 JIT runs on real hardware with MAP_JIT rather than under qemu.
# The x86_64 job also runs the PCRE2 oracle, comparing generated patterns
# against the reference on the leftmost match, every match, and offset
# searches; the corpus modes need a PCRE2 source tree and stay local.
#
# Actions are pinned to commit hashes, in the format pinact writes, so that
# what runs here cannot change under a moved tag.

name: fuzz

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64-linux
            os: ubuntu-latest
          - name: aarch64-macos
            os: macos-14

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      # The engines fuzzed against each other, as several fresh processes.
      # The fuzzer compiles a new Regex per case -- a quarter of a million
      # JIT mappings over a run -- and on macOS the resident-set cost of a
      # released MAP_JIT region is not reclaimed promptly, so RSS climbs even
      # as the actual footprint stays flat: run 2 measured a peak footprint
      # of twenty megabytes while RSS reached four gigabytes in one
      # fifty-thousand-case process. It is a fuzzer artifact, not a library
      # leak -- every mapping is unmapped, a real program compiles a pattern
      # once, and Linux (which reclaims) holds flat at seven megabytes -- but
      # a seven-gigabyte runner still kills on RSS. Fresh processes reset it,
      # and twenty-five thousand cases each keep the peak near two gigabytes;
      # `/usr/bin/time -l` on macOS keeps the footprint in the log. Eight
      # chunks walk eight seeds a week.
      - name: Fuzz the engines against each other
        shell: bash
        run: |
          for i in 0 1 2 3 4 5 6 7; do
            seed=$(( ${{ github.run_number }} * 8 + i ))
            echo "== chunk $i, seed $seed"
            if [ "$RUNNER_OS" = macOS ]; then
              /usr/bin/time -l zig build test -Dfuzz-cases=25000 -Dfuzz-alloc-cases=250 -Dfuzz-seed="$seed"
            else
              zig build test -Dfuzz-cases=25000 -Dfuzz-alloc-cases=250 -Dfuzz-seed="$seed"
            fi
          done

      # The oracle builds its own PCRE2 from source, via the reference's
      # upstream build.zig, pinned in build.zig.zon -- no system library, so
      # the reference semantics are identical on every runner. (This job's
      # first flight failed on nothing but apt shipping an older PCRE2 whose
      # POSIX class behavior differs.) That also makes it portable enough to
      # run on the macOS leg, where the aarch64 JIT faces the reference on
      # real hardware.
      - name: Fuzz against PCRE2
        run: zig build oracle -- 150000 ${{ github.run_number }}
