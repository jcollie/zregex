# Weekly long fuzz session. The per-push ci runs keep a fixed seed so a
# failure is reproducible and every push measures the same thing; this one
# walks the seed with the run number instead, because the point of a long
# session is to reach the patterns a single stream never produces. The seed
# that ran is in the job log's command line, so a failure is still
# reproducible with `zig build test -Dfuzz-cases=... -Dfuzz-seed=<n>`.
#
# Two runners: x86_64 Linux, and macOS on Apple silicon — the one place the
# aarch64 JIT runs on real hardware with MAP_JIT rather than under qemu.
# The x86_64 job also runs the PCRE2 oracle, comparing generated patterns
# against the reference on the leftmost match, every match, and offset
# searches; the corpus modes need a PCRE2 source tree and stay local.
#
# Actions are pinned to commit hashes, in the format pinact writes, so that
# what runs here cannot change under a moved tag.

name: fuzz

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64-linux
            os: ubuntu-latest
          - name: aarch64-macos
            os: macos-14

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      # A quarter of a million cases as five fresh processes rather than one
      # long one. The first run's macOS job was killed by the operating
      # system at eighty-six minutes -- memory, on a seven-gigabyte runner,
      # somewhere the leak-checking allocator cannot see: the same workload
      # holds flat at seven megabytes of resident memory on Linux. Until the
      # Darwin side is understood, fresh processes bound whatever
      # accumulates, `/usr/bin/time -l` records each chunk's peak footprint
      # in the log so the next run carries data instead of another silent
      # kill, and the chunks walk five seeds a week instead of one.
      - name: Fuzz the engines against each other
        shell: bash
        run: |
          for i in 0 1 2 3 4; do
            seed=$(( ${{ github.run_number }} * 5 + i ))
            echo "== chunk $i, seed $seed"
            if [ "$RUNNER_OS" = macOS ]; then
              /usr/bin/time -l zig build test -Dfuzz-cases=50000 -Dfuzz-alloc-cases=400 -Dfuzz-seed="$seed"
            else
              zig build test -Dfuzz-cases=50000 -Dfuzz-alloc-cases=400 -Dfuzz-seed="$seed"
            fi
          done

      # Built from the release tarball, not taken from apt: the oracle's
      # comparisons are written against PCRE2 10.47 and steer around that
      # version's known quirks, and POSIX class semantics genuinely changed
      # between the 10.42 Ubuntu ships and 10.47 -- the first run of this
      # workflow reported a dozen "disagreements" that were the reference
      # disagreeing with itself across versions.
      - name: Build PCRE2 10.47
        if: runner.os == 'Linux'
        run: |
          curl -fsSLO https://github.com/PCRE2Project/pcre2/releases/download/pcre2-10.47/pcre2-10.47.tar.bz2
          tar xf pcre2-10.47.tar.bz2
          cd pcre2-10.47
          ./configure --prefix="$GITHUB_WORKSPACE/pcre2-prefix" --disable-shared --quiet
          make -j"$(nproc)" --quiet
          make install --quiet

      - name: Fuzz against PCRE2
        if: runner.os == 'Linux'
        run: >
          zig build oracle
          -Dpcre2-include=pcre2-prefix/include
          -Dpcre2-lib=pcre2-prefix/lib
          -- 150000 ${{ github.run_number }}
